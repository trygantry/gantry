name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (GUI-free CLI + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo check (core + CLI, no GUI deps)
        run: cargo check -p gantry-core -p gantry-cli --all-targets --locked

      - name: Cargo test (core + CLI)
        run: cargo test -p gantry-core -p gantry-cli --locked

      - name: Frontend contracts and workflow acceptance
        run: npm run test:frontend

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --all

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            crates/*/*.cdx.json
            src-tauri/*.cdx.json

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check git diff line endings and whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          elif [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          elif git rev-parse -q --verify "$GITHUB_SHA^" >/dev/null; then
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          else
            echo "No base commit available; skipping diff whitespace check."
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy -p gantry-core -p gantry-cli --all-targets --locked -- -D warnings

  desktop-lint:
    name: Desktop lint (Tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Strict desktop Clippy
        run: cargo clippy -p gantry --all-targets --locked -- -D warnings
      - name: Desktop compile check
        run: cargo check -p gantry --all-targets --locked

  ui-smoke:
    name: Rendered desktop workflow (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Test rendered engineer and release-manager workflows
        run: npm run test:ui
      - name: Upload browser traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gantry-ui-smoke-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  mobile-ios-contract:
    name: Mobile contract (signed iOS IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build Gantry CLI
        run: cargo build --locked --release -p gantry-cli
      - name: Build ad-hoc signed contract IPA
        run: scripts/ci/build-ios-contract-ipa.sh
      - name: Verify native-iOS detection and durable audit reuse
        working-directory: fixtures/mobile/swift-ios-minimal
        run: |
          set -euo pipefail
          BIN="../../../target/release/gantry"
          "$BIN" mobile detect --json > build/detection.json
          "$BIN" release ensure 1.0.0-contract --owner ci@example.com --actor github-actions --json > build/release.json
          "$BIN" release candidate ensure 1.0.0-contract --artifact build/GantryFixture.ipa --actor github-actions --json > build/candidate.json
          cold_started_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          "$BIN" release audit 1.0.0-contract --reuse-unchanged --actor github-actions --json > build/audit-cold.json
          cold_duration_ms="$(($(node -e 'process.stdout.write(String(Date.now()))') - cold_started_ms))"
          warm_started_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          "$BIN" release audit 1.0.0-contract --reuse-unchanged --actor github-actions --json > build/audit-warm.json
          "$BIN" vault check --json > build/vault-health.json
          "$BIN" vault migrate --dry-run --json > build/vault-migration.json
          warm_duration_ms="$(($(node -e 'process.stdout.write(String(Date.now()))') - warm_started_ms))"
          export COLD_DURATION_MS="$cold_duration_ms" WARM_DURATION_MS="$warm_duration_ms"
          node - <<'NODE'
          const fs = require("fs");
          const read = (name) => JSON.parse(fs.readFileSync(`build/${name}`, "utf8"));
          const detection = read("detection.json");
          const cold = read("audit-cold.json");
          const warm = read("audit-warm.json");
          if (!detection.stacks.includes("native_ios") || !detection.platforms.includes("ios")) throw new Error("native iOS detection contract failed");
          if (detection.ios_targets.length !== 1) throw new Error("expected exactly one first-party iOS target");
          if (cold.report.artifact.platform !== "ios") throw new Error("expected an iOS artifact report");
          if (cold.report.artifact.signature_verification.status !== "verified") throw new Error("codesign authority verification did not pass");
          if (cold.report.artifact.privacy_manifest_present !== true) throw new Error("packaged privacy manifest was not detected");
          if (cold.report.artifact.sha256.length !== 64) throw new Error("artifact SHA-256 contract failed");
          if (cold.cache_hit !== false || warm.cache_hit !== true) throw new Error("cold/warm cache contract failed");
          for (const field of ["id", "report_fingerprint", "policy_digest"]) {
            if (cold.audit[field] !== warm.audit[field]) throw new Error(`audit identity changed: ${field}`);
          }
          const performance = {
            schema_version: "1.0",
            runner_os: process.platform,
            cold_audit_ms: Number(process.env.COLD_DURATION_MS),
            warm_audit_ms: Number(process.env.WARM_DURATION_MS),
            warm_cache_hit: warm.cache_hit,
            onboarding_budget_ms: 600000,
            audit_budget_met: Number(process.env.COLD_DURATION_MS) <= 600000 && Number(process.env.WARM_DURATION_MS) <= 600000,
          };
          fs.writeFileSync("build/performance.json", `${JSON.stringify(performance, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Gantry iOS contract performance\n\n| Cold audit | Warm audit | Warm cache | Ten-minute audit budget |\n| ---: | ---: | :---: | :---: |\n| ${performance.cold_audit_ms} ms | ${performance.warm_audit_ms} ms | ${performance.warm_cache_hit} | ${performance.audit_budget_met} |\n`);
          NODE
      - name: Upload iOS contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gantry-ios-contract-evidence
          if-no-files-found: error
          path: |
            fixtures/mobile/swift-ios-minimal/build/*.json
            fixtures/mobile/swift-ios-minimal/.gantry/releases/**/*.json
            fixtures/mobile/swift-ios-minimal/.gantry/releases/**/events.jsonl

  security:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run security audit
        run: cargo audit

  coverage:
    name: Core and CLI coverage evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Rust branch coverage still requires -Z coverage-options=branch.
          # Keep this isolated from the stable/MSRV build and pin it for reproducibility.
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install coverage runner
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Generate branch coverage report
        run: cargo +nightly-2026-08-01 llvm-cov -p gantry-core -p gantry-cli --all-targets --branch --lcov --output-path lcov.info
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gantry-rust-coverage
          path: lcov.info
          if-no-files-found: error

  msrv:
    name: MSRV verification (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo check MSRV
        run: cargo check -p gantry-core -p gantry-cli --all-targets --locked
